name: Custom Reminders

on:
  schedule:
    - cron: '*/30 * * * *'
  workflow_dispatch: {}

jobs:
  check-and-send:
    runs-on: ubuntu-latest
    steps:
      - name: Check reminders and send any that are due
        env:
          SUPABASE_URL: https://vraxhwrirrrptawxgztf.supabase.co
          SUPABASE_ANON_KEY: sb_publishable_-729QUM1pXlABgVUWijGiw_Xf0GTspj
          ONESIGNAL_APP_ID: dccc2508-ed7b-47a3-9088-3253af5427f5
          ONESIGNAL_REST_API_KEY: ${{ secrets.ONESIGNAL_REST_API_KEY }}
        run: |
          set -e

          REMINDERS=$(curl -s "$SUPABASE_URL/rest/v1/kv_store?key=eq.pet-crm-custom-reminders&select=value" \
            -H "apikey: $SUPABASE_ANON_KEY" -H "Authorization: Bearer $SUPABASE_ANON_KEY")
          COUNT=$(echo "$REMINDERS" | jq -r '.[0].value | length // 0')
          echo "Found $COUNT reminder(s) configured."
          if [ "$COUNT" == "0" ] || [ "$COUNT" == "null" ]; then
            echo "No reminders configured - exiting."
            exit 0
          fi

          LASTSENT=$(curl -s "$SUPABASE_URL/rest/v1/kv_store?key=eq.pet-crm-custom-reminders-lastsent&select=value" \
            -H "apikey: $SUPABASE_ANON_KEY" -H "Authorization: Bearer $SUPABASE_ANON_KEY")
          LASTSENT_MAP=$(echo "$LASTSENT" | jq -c '.[0].value // {}')

          NOW_HM=$(TZ=Asia/Jerusalem date +%H:%M)
          NOW_DATE=$(TZ=Asia/Jerusalem date +%F)
          NOW_MIN=$(( 10#$(echo "$NOW_HM" | cut -d: -f1) * 60 + 10#$(echo "$NOW_HM" | cut -d: -f2) ))
          echo "Now (Israel time): $NOW_HM on $NOW_DATE"

          UPDATED_LASTSENT="$LASTSENT_MAP"
          ANY_SENT=false

          for i in $(echo "$REMINDERS" | jq -r '.[0].value | keys[]'); do
            R=$(echo "$REMINDERS" | jq -c ".[0].value[$i]")
            ID=$(echo "$R" | jq -r '.id')
            ENABLED=$(echo "$R" | jq -r '.enabled')
            TIME=$(echo "$R" | jq -r '.time // "20:00"')
            ROLE=$(echo "$R" | jq -r '.targetRole // "rep"')
            MSG=$(echo "$R" | jq -r '.message // ""')
            TITLE=$(echo "$R" | jq -r '.title // ""')

            if [ "$ENABLED" != "true" ]; then continue; fi
            if [ -z "$MSG" ]; then continue; fi

            TARGET_MIN=$(( 10#$(echo "$TIME" | cut -d: -f1) * 60 + 10#$(echo "$TIME" | cut -d: -f2) ))
            DIFF=$(( NOW_MIN - TARGET_MIN ))
            if [ $DIFF -lt 0 ]; then DIFF=$(( -DIFF )); fi
            if [ $DIFF -gt 20 ]; then continue; fi

            LAST_FOR_ID=$(echo "$LASTSENT_MAP" | jq -r --arg id "$ID" '.[$id] // ""')
            if [ "$LAST_FOR_ID" == "$NOW_DATE" ]; then
              echo "Reminder $ID already sent today - skipping."
              continue
            fi

            HEADING="${TITLE:-⏰ תזכורת}"
            echo "Sending reminder $ID to role_$ROLE: $MSG"
            curl -s -X POST "https://api.onesignal.com/notifications" \
              -H "Content-Type: application/json; charset=utf-8" \
              -H "Authorization: Key $ONESIGNAL_REST_API_KEY" \
              -d "$(jq -n --arg app "$ONESIGNAL_APP_ID" --arg h "$HEADING" --arg m "$MSG" --arg role "role_$ROLE" \
                    '{app_id:$app, headings:{en:$h}, contents:{en:$m}, filters:[{field:"tag", key:$role, relation:"=", value:"1"}]}')"

            UPDATED_LASTSENT=$(echo "$UPDATED_LASTSENT" | jq --arg id "$ID" --arg d "$NOW_DATE" '.[$id] = $d')
            ANY_SENT=true
          done

          if [ "$ANY_SENT" == "true" ]; then
            echo "Recording last-sent dates: $UPDATED_LASTSENT"
            curl -s -X POST "$SUPABASE_URL/rest/v1/kv_store" \
              -H "apikey: $SUPABASE_ANON_KEY" -H "Authorization: Bearer $SUPABASE_ANON_KEY" \
              -H "Content-Type: application/json" -H "Prefer: resolution=merge-duplicates" \
              -d "$(jq -n --argjson v "$UPDATED_LASTSENT" '[{key:"pet-crm-custom-reminders-lastsent", value:$v}]')"
          else
            echo "Nothing due this cycle."
          fi

          echo "Done."
